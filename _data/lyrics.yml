# _data/lyrics.yml
- text: "봄 몇 송이, 여름 한 컵, 가을 한 장, 겨울 한 숨."
  artist: "[아이유] <b>자장가 </b>中"

- text: "우주를 지나 너에게 전한 노래<br>영원의 시간 속에서도 나의 이 마음 변치 않아"
  artist: "[옥상달빛] <b>잘 지내, 어디서든 </b>中"

- text: "늘 바래준 너의 집앞 좁은 길에 낯설어진 내 발걸음은<br>한참 지나쳐도 등 뒤가 아파<br>"
  artist: "[노리플라이] <b>그대 걷던 길 </b>中"

- text: "그댈 볼 순 없지만 난 같은 길로만<br>함께 걷던 길로만 걷네"
  artist: "[노리플라이] <b>그대 걷던 길 </b>中"

- text: "아직은 외투를 여미어야 하는 날들이지만,<br>내 마음 한켠엔 이미 꽃잎이 맺혔나 봐요."
  artist: "[최유리] <b>초봄 </b>中"

- text: "그대에게 전하고 싶은 말이 있어요.<br>그대의 하루가 오늘도 행복하길 바래요."
  artist: "[김광석] <b>하루 </b>中"

- text: "천천히 멀어져줘요 내게서 나와 맺은 추억들 모두<br>급히 돌아설 것들이었나<br>한밤의 꿈처럼 잊혀져가네"
  artist: "[신지훈] <b>시가 될 이야기 </b>中"

- text: "그 계절 피어 있었던 푸름은 어느새 하얀 빛의 꽃잎을 틔워내,<br>가장 낮은 그곳에서 부단히도 크던 너는 훌쩍 눈을 맞춰 말을 건네와 참 고마워."
  artist: "[벤] <b>풀꽃 </b>中"

- text: "아이 같은 나를 사랑해줬던, <br>눈이 부시게 겨울을 닮은 너를"
  artist: "[정준일] <b>겨울을 닮은 너 </b>中"

- text: "우리 이제 시간이 기억이<br> 우리를 잊을 때까지 이대로 기다리자"
  artist: "[주윤하] <b>에필로그 </b>中"

- text: "눈을 감으면 문득 그리운 날의 기억<br> 아직까지도 마음이 저려 오는 건<br> 그건 아마 사람도 피고 지는 꽃처럼<br>아름다워서 슬프기 때문일 거야, 아마도"
  artist: "[김윤아] <b>봄날은 간다 </b>中"

- text: "함께 걷자고 했잖아 나란히 걷자 했잖아<br>이토록 날이 좋은데 여전히 난 홀로 걷는다"
  artist: "[김동률] <b>산책 </b>中"

- text: "하얗게 멀어져 간다 네가 너무나 멀어서 missing you<br>네가 너무나 작아서 한 조각 닿지 않고 붉게 물든 바다"
  artist: "[이승환] <b>화양연화 </b>中"

- text: "붉게 물든 바다 다 타 들어간다 네가 너무 그리워서 missing you<br>네가 너무 보고파서 오늘도 달빛 아래"
  artist: "[이승환] <b>화양연화 </b>中"

- text: "나는 운이 좋았지<br>내 삶에서 나보다도<br>사랑한 사람이 있었으니"
  artist: "[권진아] <b>운이 좋았지 </b>中"

- text: "어색하게 오간 장난들 사이에 넘쳐흐르는 아지랑이 속의<br>그저 아름다웠던 우리에게<br>불러 주고픈 이 초록빛 노래<br>들리니?"
  artist: "[윤마치] <b>초록 </b>中"